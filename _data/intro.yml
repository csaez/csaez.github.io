content: |
  Engineering leader with 20+ years across research, product engineering, and
  production platforms. I lead multi-team organisations, turn ambiguous
  technical problems into product direction, and design operating models that
  help teams deliver consistently, often through influence beyond formal
  authority.

  I lead by creating the conditions for experts to own difficult problems. I
  stay close enough to technology to engage with architecture and trade-offs,
  while focusing my leverage on decisions, structures, and context that help
  people do their best work.
