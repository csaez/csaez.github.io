content: |
  Engineering leader with 20+ years of technical experience, from writing C++ and
  Python for visual effects to leading engineering teams, scaling organisations,
  and shaping how they work. I've worked across research, product engineering,
  and large-scale production platforms, consistently operating above my formal
  title by holding the frame rather than the authority.

  Leading a team of PhD researchers in a domain I knew less deeply than the team
  I was leading taught me the most important lesson of my career: that real
  ownership must be delegated, and that my success is measured by the team's
  rather than by the code I write. I retain the technical depth to engage
  meaningfully with architectural decisions and step into critical work when
  delivery is at risk, but the proof I care about is what gets built after I
  step back, and that is the only metric I have ever found worth optimising for.