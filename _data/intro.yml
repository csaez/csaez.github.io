content: |
  Engineering leader and technology strategist with 20+ years across research,
  product engineering, and large-scale production platforms. I lead multiple
  engineering teams, and much of my impact has come through influence rather than
  formal authority: problems I have reframed have become initiatives adopted at
  director level and above. What I do best is help organisations decide what to
  build and how to build it when technology shifts and the old assumptions stop
  holding, reasoning from first principles to turn a messy, high-stakes problem
  into a clear direction people can act on.

  Leading a team of researchers who understood their field better than I did
  taught me the lesson that still shapes how I work: my job is to create the
  conditions for other people to own the problem, not to hold the answers myself.
  I stay close enough to the technology to engage with architecture and hard
  trade-offs, but my leverage is in the decisions and structures that let good
  people do their best work. I measure it by the quality of the decisions an
  organisation makes, and by what holds up long after I step away.
