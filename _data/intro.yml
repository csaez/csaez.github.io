content: |
  Engineering leader with 20+ years of technical experience, from writing C++ and
  Python for visual effects to leading engineering teams, scaling organisations,
  and shaping how they work. I've worked across research, product engineering,
  and large-scale production platforms, often leading through influence rather
  than authority.

  Leading a team of PhD researchers in a domain I initially knew little about
  taught me the most important lesson of my career: to stop being the smartest
  person in the room, delegate real ownership, and measure my success by the
  team's rather than by the code I write. I retain enough technical depth to
  unblock teams, challenge architectural decisions, and step into critical work
  when delivery is at risk, but my focus is building organisations where
  engineers can do their best work and grow into leaders.