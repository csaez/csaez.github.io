# Jobs
- company: Foundry, London
  position: Engineering Manager, Katana
  duration: Jul 2025 - Present
  summary: |
    - **Manage two engineering teams (~13 people across engineering, QA, and
      product) delivering the core of the next major Katana release.** Expanded
      from one team to two after an org restructuring, taking ownership of a
      larger product area when a peer manager departed.
    - **Kept a team delivering ahead of schedule after it lost its lead architect
      mid-project.** Stepped in to bridge the technical gap while reducing
      dependence on a single expert, helping the team consistently finish early
      and support other teams.
    - **Designed a delivery process adopted across the entire Katana product
      line.** Introduced a rotating Feature Facilitator role that gives engineers
      ownership of upfront technical analysis, improving planning and estimation
      across all three teams.
    - **Shaped Foundry's thinking on AI-assisted extensibility.** Identified an
      opportunity to make creative software easier to extend with AI-assisted
      development, validated the idea with major VFX studios, and developed it
      into a strategic proposal for senior leadership.
    - **Helped define company-wide engineering practice for AI-assisted
      development.** Co-authored Foundry's guidelines for identifying
      AI-authored code as part of the AI Enablement working group.
    - **Coach peer engineering managers across multiple organizations,** and -
      at the CTO's recommendation - mentor a senior engineer in another
      department preparing for a management role.

- company: Foundry, London
  position: Engineering Manager, AI Research
  duration: Jul 2022 - Jul 2025
  summary: |
    - **Grew a single research team into a two-team organisation I managed
      directly (~9 people),** creating the operating model that a four-team
      organisation later scaled on. As demand grew, hired into the team, split
      the work into two focused groups, and established the structure and ways
      of working adopted by subsequent teams.
    - **Developed two senior engineers into engineering managers who now lead
      their own teams.** For one, that meant a year of deliberate coaching -
      closing skill gaps and helping her choose between an IC and management
      path. Building the next layer of leadership was a deliberate part of the
      team's growth.
    - **Led researchers building production ML capabilities for Nuke.**
      Expanded CopyCat and Inference with major improvements, including Apple
      Silicon support, shipped Cattery, and laid the research and engineering
      foundations for later features including Smart Roto and BigCat.
    - **Owned product and delivery responsibilities alongside engineering
      leadership when the organisation lacked dedicated roles.** Set roadmaps
      with product stakeholders, ran planning and tracking, and regularly
      presented the organisation's work to the executive team at quarterly
      reviews.
    - **Built and ran the technical hiring framework for research engineering.**
      Designed a metrics-based scoring system and consistent interview panel to
      evaluate candidates objectively, later adapting and sharing it with other
      groups to improve consistency and reduce bias.

- company: Foundry, London
  position: Senior Software Engineer, Real-Time Research
  duration: Sep 2020 - Jul 2022
  summary: |
    - **Drove early prototyping of what became Nuke Stage, Foundry's real-time
      virtual production product** (now used on live film productions). As the most
      senior engineer in the early team, I built prototypes across the stack while
      the product direction was still being found - GPU compute kernels for 2.5D
      virtual-production scenarios (on-set color grading, spherical mapping), the
      application and plugin architecture, camera-tracking integration, and
      networking. This exploratory work helped shape the direction the shipping
      product was later built on.
    - **Joined as the team's USD expert and contributed to the early prototype of
      Nuke's USD-based 3D system.** Collaborated with the project's lead architect
      during the prototyping phase, building out core nodes for a plugin that could
      coexist with Nuke's native 3D system. The prototype was greenlit and matured
      by the team over several years into what ships today.

