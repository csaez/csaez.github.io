content: |
  Engineering leader with 20+ years across research, product engineering, and
  production platforms. I lead multiple engineering teams, and much
  of my impact has come through influence rather than formal authority: problems
  I have reframed have become initiatives adopted at director level and above.
  I'm most effective on problems that don't fit neatly inside one team,
  especially when technology shifts and established assumptions no longer hold.

  Leading a team of researchers who understood their field better than I did
  taught me the lesson that still shapes how I work: my job is to create the
  conditions for other people to own the problem, not to hold the answers myself.
  I stay close enough to the technology to engage with architecture and hard
  trade-offs, but my leverage comes from the decisions, structures, and context
  that let people own problems and do their best work. I measure it by the quality of the decisions an
  organisation makes, and by what holds up long after I step away.
